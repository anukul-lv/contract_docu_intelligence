    value: ""
  - name: AI_GATEWAY_CHAT_ENDPOINT
    value: ""
  - name: AI_GATEWAY_EMBEDDING_ENDPOINT
    value: ""
  - name: AI_SEARCH_ENDPOINT
    value: ""
  - name: AGENT_SERVING_ENDPOINT
    value: ""
  - name: FEATURE_FLAG_CACHE_TTL_SEC
    value: "60"
