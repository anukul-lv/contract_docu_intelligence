    value: "dev"
  - name: APP_SCHEMA
    value: "doc_intel"
  - name: CUSTOMER_CATALOG
    value: "dev"
  - name: CUSTOMER_SCHEMA
    value: "doc_intel"
  - name: DATABRICKS_WAREHOUSE_ID
    value: "1b6b94e30940a2dc"
  - name: VOLUME_PATH
    value: "/Volumes/dev/doc_intel/prvdr_contracts"
